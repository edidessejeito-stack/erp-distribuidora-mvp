<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Suprime avisos e erros inofensivos de WebSocket do Vite HMR desativado no ambiente cloud
      (function() {
        var origConsoleError = console.error;
        var origConsoleWarn = console.warn;
        function isViteHmrError(args) {
          try {
            var text = Array.prototype.slice.call(args).map(function(arg) {
              if (typeof arg === 'string') return arg;
              if (arg && arg.message) return arg.message;
              if (arg && arg.stack) return arg.stack;
              return '';
            }).join(' ');
            return text.includes('[vite]') || text.includes('WebSocket') || text.includes('vite:ws') || text.includes('@vite/client');
          } catch(e) {
            return false;
          }
        }
        console.error = function() {
          if (isViteHmrError(arguments)) return;
          return origConsoleError.apply(console, arguments);
        };
        console.warn = function() {
          if (isViteHmrError(arguments)) return;
          return origConsoleWarn.apply(console, arguments);
        };
      })();
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = reason && (reason.message || String(reason));
        var stack = reason && reason.stack;
        if (
          (msg && (msg.includes('WebSocket') || msg.includes('vite:ws') || msg.includes('[vite]'))) ||
          (stack && stack.includes('@vite/client'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      // Inicialização instantânea do tema (Claro por padrão)
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
      window.addEventListener('error', function(event) {
        if (
          (event.message && (event.message.includes('WebSocket') || event.message.includes('[vite]'))) ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
    <title>Distribuidora ERP Inteligente</title>
    <meta name="description" content="ERP moderno, ultrarrápido e mobile-first para distribuidoras com cadastro inteligente via IA e controle de estoque offline-first." />
    <meta property="og:title" content="Distribuidora ERP Inteligente" />
    <meta property="og:description" content="ERP moderno, ultrarrápido e mobile-first para distribuidoras com cadastro inteligente via IA e controle de estoque offline-first." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1A73E8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DistribERP" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased select-none font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
